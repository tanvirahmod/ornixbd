# Render Blueprint — ORNIX static site
#
# Deploy with "New +" → "Blueprint" in the Render dashboard (it reads this
# file), or configure a static site manually with the same values.
#
# You will be prompted for VITE_SUPABASE_ANON_KEY (sync: false) on first
# deploy — paste the value from .env. It is the same public anon key the
# browser already uses; it is NOT a secret.
#
# Route extensionless URLs to the prerendered HTML files generated at build
# time. Keep SPA rewrites only for app routes without prerendered files.

services:
  - type: web
    name: ornix
    runtime: static
    buildCommand: npm run build:render
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_SUPABASE_URL
        value: https://uzuzffvnukhdckaqqvfa.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /product/*
        destination: /product/*/index.html
      - type: rewrite
        source: /collections/*
        destination: /collections/*/index.html
      - type: rewrite
        source: /collections
        destination: /collections/index.html
      - type: rewrite
        source: /new-arrivals
        destination: /new-arrivals/index.html
      - type: rewrite
        source: /hot-deals
        destination: /hot-deals/index.html
      - type: rewrite
        source: /shop-by-size
        destination: /shop-by-size/index.html
      - type: rewrite
        source: /shop-by-size/*
        destination: /index.html
      - type: rewrite
        source: /story
        destination: /story/index.html
      - type: rewrite
        source: /policies
        destination: /policies/index.html
      - type: rewrite
        source: /track
        destination: /track/index.html
      - type: rewrite
        source: /feedback
        destination: /feedback/index.html
      - type: rewrite
        source: /cart
        destination: /index.html
      - type: rewrite
        source: /checkout/*
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /shop
        destination: /index.html
      - type: rewrite
        source: /shop-by-size/*
        destination: /index.html

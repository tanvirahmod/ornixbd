# Render Blueprint — ORNIX static site
#
# Deploy with "New +" → "Blueprint" in the Render dashboard (it reads this
# file), or configure a static site manually with the same values.
#
# You will be prompted for VITE_SUPABASE_ANON_KEY (sync: false) on first
# deploy — paste the value from .env. It is the same public anon key the
# browser already uses; it is NOT a secret.
#
# Product, collection, and public content routes are prerendered as real files.
# Rewrite only the app routes that do not have a prerendered HTML file.

services:
  - type: web
    name: ornix
    runtime: static
    buildCommand: npm run build:render
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_SUPABASE_URL
        value: https://uzuzffvnukhdckaqqvfa.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /cart
        destination: /index.html
      - type: rewrite
        source: /checkout/*
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /shop
        destination: /index.html
      - type: rewrite
        source: /shop-by-size/*
        destination: /index.html
